          p = get_json(URLS['gwas_catalog_v2'], {'rs_id':'rs855791','page':0,'size':2})
          print('GWAS_RESPONSE_ROOT_KEYS:', list(p)[:24] if isinstance(p, dict) else type(p).__name__)
