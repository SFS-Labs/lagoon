              if isinstance(x, dict):
                  print('GWAS_FIRST_FIELD_TYPES:', {k:type(v).__name__ for k,v in x.items()})
                  print('GWAS_PUBLIC_RSID_FIELDS:', {k:str(v)[:150] for k,v in x.items() if 'rs' in k.lower() or 'variant' in k.lower() or 'snp' in k.lower()})
